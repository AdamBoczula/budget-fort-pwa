<!-- spec: docs/qa/2026-10-21-ui-ux-audit.md -->
<div
  class="budget-progress"
  role="progressbar"
  [attr.aria-valuenow]="percentage()"
  aria-valuemin="0"
  aria-valuemax="100"
  [attr.aria-label]="label() ? label() + ': ' + percentage() + '%' : percentage() + '%'"
>
  @if (label()) {
    <div class="budget-progress__label">{{ label() }}</div>
  }
  <div class="budget-progress__bar-bg">
    <div
      class="budget-progress__bar-fill"
      [style.width.%]="showZeroLimit() ? 0 : percentage()"
      [style.background]="showZeroLimit() ? 'var(--mat-sys-surface-container-high, #e0e0e0)' : gradientStyle()"
    ></div>
  </div>
  <div class="budget-progress__text">
    @if (showZeroLimit()) {
      <span i18n="@@budgetProgress.noLimit">Brak limitu</span>
    } @else {
      {{ formattedSpent() }} / {{ formattedLimit() }} {{ currencySymbol }}
      <span class="budget-progress__percentage">({{ percentage() }}%)</span>
    }
  </div>
</div>
