<section class="settings-section">
  <h2 i18n="@@settings.currencyTitle">Waluta</h2>

  <mat-form-field appearance="outline" class="settings-select">
    <mat-label i18n="@@settings.currencyLabel">Wybierz walutę</mat-label>
    <mat-select [value]="activeCurrency()" (selectionChange)="onCurrencyChange($event.value)">
      @for (currency of currencyOptions; track currency.code) {
        <mat-option [value]="currency.code">
          <span class="currency-option">
            <span class="currency-flag">{{ currency.flag }}</span>
            <span>{{ currency.label }}</span>
          </span>
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
</section>
